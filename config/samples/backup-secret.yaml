# Copy to a real Secret. Keys must match Backup.spec.secretRef.
apiVersion: v1
kind: Secret
metadata:
  name: backup-app-postgres
  namespace: backup
type: Opaque
stringData:
  username: app
  password: change-me
  s3_access_key: change-me
  s3_secret_key: change-me
  gpg_passphrase: change-me
  # spec.encryption.method: age instead: drop gpg_passphrase and set the public key
  # (Backup) or the private key file (Restore):
  # age_recipient: age1...
  # age_identity: AGE-SECRET-KEY-1...
