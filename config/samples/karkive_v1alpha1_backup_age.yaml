# Backup encrypted with age: spec.secretRef needs age_recipient (public key) instead of gpg_passphrase.
apiVersion: karkive.io/v1alpha1
kind: Backup
metadata:
  name: app-postgres-age
  namespace: backup
spec:
  engine: postgres
  schedule: "0 2 * * *"
  database:
    host: postgres.example.svc.cluster.local
    port: 5432
    name: app
  s3:
    endpoint: https://s3.example.com
    bucket: backups
    path: app/pgdump-age
    retentionDays: 14
  secretRef:
    name: backup-app-postgres-age
  encryption:
    method: age   # gpg (default) | age
  persistence:
    enabled: true
    size: 1Gi
  localRetentionDays: 7
