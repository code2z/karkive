# Backup encrypted with age (X25519): the Backup Secret holds only the public key.
#   age-keygen -o age.key   # keep age.key for the Restore Secret (age_identity)
---
apiVersion: v1
kind: Secret
metadata:
  name: backup-app-postgres-age
  namespace: backup
type: Opaque
stringData:
  username: app
  password: change-me
  s3_access_key: change-me
  s3_secret_key: change-me
  # Public key(s) from `age-keygen -y age.key`, one per line. No gpg_passphrase needed.
  age_recipient: age1ql3z7hjy54pw3hyww5ayyfg7zqgvc7w3j2elw8zmrj2kg5sfn9aqmcac8p
---
apiVersion: karkive.io/v1alpha1
kind: Backup
metadata:
  name: app-postgres-age
  namespace: backup
spec:
  engine: postgres
  schedule: "0 2 * * *"
  database:
    host: postgres.example.svc.cluster.local
    port: 5432
    name: app
  s3:
    endpoint: https://s3.example.com
    bucket: backups
    path: app/pgdump-age
    retentionDays: 14
  secretRef:
    name: backup-app-postgres-age
  encryption:
    method: age          # objects end in .age (pg_dump-app-<ts>.dump.age in Stream mode)
  pipeline:
    mode: Stream         # Stage mode works too (encrypt runs in defaults.ageImage)
  persistence:
    enabled: true
    size: 1Gi
