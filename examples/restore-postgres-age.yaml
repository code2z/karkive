# Restore of age-encrypted backups: only the Restore Secret holds the private key.
---
apiVersion: v1
kind: Secret
metadata:
  name: restore-app-postgres-age
  namespace: backup
type: Opaque
stringData:
  s3_access_key: change-me
  s3_secret_key: change-me
  # Contents of age.key (from age-keygen). No gpg_passphrase needed.
  # kubectl -n backup create secret generic restore-app-postgres-age --from-file=age_identity=age.key ...
  age_identity: AGE-SECRET-KEY-1CHANGEMECHANGEMECHANGEMECHANGEMECHANGEMECHANGEMECHANGEME
---
apiVersion: karkive.io/v1alpha1
kind: Restore
metadata:
  name: app-postgres-age
  namespace: backup
spec:
  engine: postgres
  schedule: "30 2 * * *"
  suspend: true
  database:
    host: postgres-sandbox.example.svc.cluster.local
    port: 5432
    name: app
    ownerRole: app
  s3:
    endpoint: https://s3.example.com
    bucket: backups
    path: app/pgdump-age
  secretRef:
    name: restore-app-postgres-age
  encryption:
    method: age          # must match the Backup; only *.age objects are picked
  pipeline:
    mode: Stream
  postgresSecret:
    name: postgres
  useLatestBackupAsFallback: true
  persistence:
    enabled: false
    size: 2Gi
